name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python tests
        run: python -m pytest

  plugin:
    name: OpenClaw plugin (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/guard-openclaw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/guard-openclaw/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build runtime files
        run: npm run build
      - name: Verify committed runtime files are current
        working-directory: .
        run: git diff --exit-code -- plugins/guard-openclaw/dist

  web:
    name: Web console (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build production console
        run: npm run build
      - name: Verify committed console files are current
        working-directory: .
        run: git diff --exit-code -- guardd/ui/static
