[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-guard-agent"
version = "0.1.0"
description = "Local deterministic guardrail service for OpenClaw"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
guardd = "guardd.main:main"
guardctl = "guardd.cli:app"

[tool.setuptools.packages.find]
include = ["guardd*"]

[tool.setuptools.package-data]
"guardd.policy" = ["policy.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
