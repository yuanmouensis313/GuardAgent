[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-guard-agent"
version = "0.1.0"
description = "Local policy-first guardrail and bounded safety-agent service for OpenClaw"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
guardagent = "guardd.launcher:main"
guardd = "guardd.main:main"
guardctl = "guardd.cli:app"
guard-mcp-proxy = "guardd.mcp_proxy:main"

[tool.uv]
required-version = ">=0.11.24"

[tool.setuptools.packages.find]
include = ["guardd*"]

[tool.setuptools.package-data]
guardd = ["ui/static/**/*"]
"guardd.policy" = ["policy.schema.json"]
"guardd.sanitization" = ["patterns.json"]
"guardd.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
